name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build Android app
        run: ./gradlew :composeApp:assembleDebug
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ hashFiles('**/*.xcodeproj/project.pbxproj', '**/*.xcworkspace/contents.xcworkspacedata', '**/*.swift', '**/*.m', '**/*.mm', '**/*.kt', '**/*.kts', '**/*.gradle.kts') }}
      - name: Build iOS shared framework
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64
      - name: Prepare iOS simulator
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes | grep -Eo "com\.apple\.CoreSimulator\.SimRuntime\.iOS[-0-9A-Za-z.]+" | head -n1)
          DEVICETYPE=$(xcrun simctl list devicetypes | grep -Eo "com\.apple\.CoreSimulator\.SimDeviceType\.iPhone[-A-Za-z0-9]+" | head -n1)
          if [[ -z "${RUNTIME}" || -z "${DEVICETYPE}" ]]; then
            echo "No iOS runtime or iPhone device type found."
            xcrun simctl list runtimes
            xcrun simctl list devicetypes
            exit 1
          fi
          SIM_ID=$(xcrun simctl create "CI iPhone" "${DEVICETYPE}" "${RUNTIME}")
          echo "SIM_ID=${SIM_ID}" >> "${GITHUB_ENV}"
      - name: Build iOS app (Simulator)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${SIM_ID}" \
            build
      - name: Build iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
